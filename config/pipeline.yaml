models:
  whisper: base.en
  sentiment: ProsusAI/finbert
  embedding: BAAI/bge-small-en-v1.5

generation:
  llm_model: openai/gpt-oss-120b
  top_k_quotes: 4
  max_tokens: 1500             # baseline free-text report
  max_tokens_structured: 8000  # allow complete verbatim citations and the required summary

retrieval:
  top_k: 3            # prior-quarter chunks surfaced as cross-quarter context
  chunk_words: 250
  embed_dim: 384
  table_name: transcript_chunks

evaluation:
  citation_match_threshold: 0.6
  citation_tolerance_sec: 2.0

# Local Postgres + pgvector instance. Not a secret at this scale (local trust auth),
# but centralized here instead of hardcoded in src/rag/build_index.py.
postgres:
  database: candor
  host: localhost
  port: 5432
  user: kannaiah
  password: ""
