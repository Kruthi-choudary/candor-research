services:
  - type: web
    name: candor-api
    env: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: READ_ONLY_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
